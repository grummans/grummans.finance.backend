openapi: 3.1.0
info:
  title: Terminal Finance API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/obligations:
    post:
      summary: Create a VND obligation template
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '201': {description: Created}
        '409': {description: Idempotency-Key was already used with a different obligation request}
  /api/v1/obligations/{obligationID}/occurrences:
    post:
      summary: Create an obligation occurrence
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - $ref: '#/components/parameters/ObligationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due_date, amount_vnd]
              properties:
                due_date: {type: string, format: date}
                amount_vnd: {type: integer, format: int64, minimum: 1}
                is_estimate:
                  type: boolean
                  default: false
                  description: >-
                    Books a reserve for a variable bill whose real amount is not known yet (D-012).
                    Omitted means the amount is the real one; updating the amount later confirms it.
              additionalProperties: false
      responses:
        '201': {description: Created}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409': {description: Idempotency-Key was already used with a different occurrence request}
        '422': {description: The obligation does not exist}
  /api/v1/occurrences/{occurrenceID}:
    patch:
      summary: Confirm or update an occurrence amount
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - $ref: '#/components/parameters/OccurrenceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_vnd]
              properties:
                amount_vnd: {type: integer, format: int64, minimum: 1}
              additionalProperties: false
      responses:
        '200': {description: Updated occurrence}
        '409': {description: Idempotency-Key was already used with a different amount}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Occurrence not found
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Amount is below paid amount
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    get:
      summary: Get remaining amount and status for one occurrence
      parameters:
        - $ref: '#/components/parameters/OccurrenceID'
      responses:
        '200': {description: Occurrence}
        '404': {description: Not found}
  /api/v1/occurrences/{occurrenceID}/payments:
    post:
      summary: Record an idempotent partial payment
      parameters:
        - $ref: '#/components/parameters/OccurrenceID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_vnd, paid_at]
              properties:
                amount_vnd: {type: integer, format: int64, minimum: 1}
                paid_at: {type: string, format: date-time}
              additionalProperties: false
      responses:
        '201': {description: Payment recorded or original response returned}
        '404': {description: Occurrence not found}
        '422': {description: Payment exceeds remaining amount}
        '409': {description: 'Idempotency-Key was already used with a different occurrence, amount or paid_at'}
        '400': {description: Invalid request}
    get:
      summary: List the payments of an occurrence, newest first
      description: A payment never counts as a transaction by itself; transaction_id is set only after a manual link.
      parameters:
        - $ref: '#/components/parameters/OccurrenceID'
      responses:
        '200':
          description: Payments of the occurrence
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
                  payments:
                    type: array
                    items: {$ref: '#/components/schemas/Payment'}
        '400':
          description: occurrenceID must be a UUID
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Occurrence not found
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/accounts:
    get:
      summary: List accounts with opening balances
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}
    post:
      summary: Create an account
      description: A CREDIT account carries credit_limit_vnd and no opening balance; its limit is never part of cash on hand.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                kind: {type: string, enum: [CASH, BANK, CREDIT]}
                opening_balance_vnd: {type: [integer, 'null'], format: int64, minimum: 0, description: null is treated as zero}
                credit_limit_vnd: {type: [integer, 'null'], format: int64, minimum: 1}
              additionalProperties: false
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Idempotency-Key was already used with different account fields
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/categories:
    get:
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
    post:
      summary: Create a category, returning the existing one when the name is taken
      description: A taken name returns the existing category; an empty body or an unknown field is rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
              additionalProperties: false
      responses:
        '201':
          description: Created or existing
          content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}
        '409':
          description: Idempotency-Key was already used with a different category name
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/transactions:
    get:
      summary: Timeline, optionally filtered by business date range and category
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        '400':
          description: Invalid filter
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    post:
      summary: Create a transaction, or a linked OUT/IN posting pair for a transfer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, type, amount_vnd, occurred_at]
              properties:
                account_id: {type: string, format: uuid}
                to_account_id:
                  type: [string, 'null']
                  format: uuid
                  description: Required for TRANSFER; null counts as absent, and a non-empty value is rejected for every other type
                type: {type: string, enum: [EXPENSE, INCOME, TRANSFER, REPAYMENT, FEE, REFUND]}
                amount_vnd: {type: integer, format: int64, minimum: 1}
                occurred_at: {type: string, format: date-time}
                category_id: {type: [string, 'null'], format: uuid, description: null means uncategorised; a TRANSFER must leave it null}
                note: {type: [string, 'null'], maxLength: 500}
              additionalProperties: false
      responses:
        '201':
          description: One posting, or the two transfer postings
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Unknown account or category
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Idempotency-Key was already used for a different request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/transactions/{transactionID}:
    get:
      summary: Read one transaction
      parameters:
        - $ref: '#/components/parameters/TransactionID'
      responses:
        '200':
          description: Transaction
          content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}
        '400':
          description: transactionID must be a UUID
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Not found
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    patch:
      summary: Change or clear the category of one transaction
      description: category_id is required; send null to clear it. An empty body is rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - $ref: '#/components/parameters/TransactionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: {type: [string, 'null'], format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Updated transaction
          content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}
        '400':
          description: category_id is missing, so nothing is changed
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Not found
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Idempotency-Key was already used with a different category
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Rule violation, for example a category on a transfer
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/payments/{paymentID}/transaction:
    patch:
      summary: Link a payment to a bank transaction after manual confirmation
      description: Linking never changes the confirmed payment amount or the occurrence status. Only an OUT posting on a CASH or BANK account is eligible; an INCOME/REFUND posting or a CREDIT-card transaction returns 422.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - $ref: '#/components/parameters/PaymentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id: {type: string, format: uuid}
              additionalProperties: false
      responses:
        '200':
          description: Linked
          content: {application/json: {schema: {$ref: '#/components/schemas/PaymentLink'}}}
        '400':
          description: paymentID or transaction_id must be a UUID
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Payment not found or reversed
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Payment or transaction already linked, or Idempotency-Key was already used for a different link
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Unknown transaction, or a transaction that cannot back a payment (income, refund or credit-card posting)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/salary-receipts:
    post:
      summary: Record one actual salary receipt (a payday that already happened)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_vnd, received_on]
              additionalProperties: false
              properties:
                amount_vnd: {type: integer, format: int64, minimum: 1}
                received_on: {type: string, format: date}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/SalaryReceipt'}}}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Idempotency-Key was already used with a different amount or date
        '422':
          description: Amount is not positive, or received_on is malformed or in the future
    get:
      summary: List salary receipts, newest payday first
      responses:
        '200':
          description: Salary receipts
          content:
            application/json:
              schema:
                type: object
                required: [receipts]
                properties:
                  receipts:
                    type: array
                    items: {$ref: '#/components/schemas/SalaryReceipt'}
  /api/v1/budget/settings:
    get:
      summary: Read the configured buffer and total budget
      responses:
        '200':
          description: Budget settings
          content: {application/json: {schema: {$ref: '#/components/schemas/BudgetSettings'}}}
    put:
      summary: Replace the buffer and total budget
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [global_buffer_vnd, global_budget_vnd]
              additionalProperties: false
              description: >-
                Both fields are mandatory on every call. A null global_budget_vnd clears the
                total budget; an omitted field is a 400 so a forgotten knob cannot wipe a setting.
              properties:
                global_buffer_vnd: {type: integer, format: int64, minimum: 0}
                global_budget_vnd: {type: [integer, 'null'], format: int64, minimum: 1}
      responses:
        '200':
          description: Updated settings
          content: {application/json: {schema: {$ref: '#/components/schemas/BudgetSettings'}}}
        '400':
          description: Invalid request
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Idempotency-Key was already used with different settings
        '422':
          description: The buffer is negative or the total budget is not positive
  /api/v1/budget/current:
    get:
      summary: Salary cycle, reserves, spendable amount and today's allowance
      responses:
        '200':
          description: Budget snapshot
          content: {application/json: {schema: {$ref: '#/components/schemas/BudgetSnapshot'}}}
  /api/v1/cashflow/forecast:
    get:
      summary: Obligations still to pay before the next payday, confirmed and expected
      responses:
        '200':
          description: Forecast
          content: {application/json: {schema: {$ref: '#/components/schemas/CashflowForecast'}}}
components:
  parameters:
    ObligationID:
      name: obligationID
      in: path
      required: true
      schema: {type: string, format: uuid}
    OccurrenceID:
      name: occurrenceID
      in: path
      required: true
      schema: {type: string, format: uuid}
    TransactionID:
      name: transactionID
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaymentID:
      name: paymentID
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, unprocessable, conflict, internal_error]
        error:
          type: string
    Account:
      type: object
      required: [id, name, kind, currency, opening_balance_vnd, opened_on]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [CASH, BANK, CREDIT]}
        currency: {type: string, enum: [VND]}
        opening_balance_vnd: {type: integer, format: int64}
        credit_limit_vnd: {type: [integer, 'null'], format: int64}
        opened_on: {type: string, format: date}
    Category:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Transaction:
      type: object
      required: [id, account_id, direction, type, amount_vnd, occurred_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        account_name: {type: string}
        direction: {type: string, enum: [IN, OUT]}
        type: {type: string, enum: [EXPENSE, INCOME, TRANSFER, REPAYMENT, FEE, REFUND]}
        amount_vnd: {type: integer, format: int64, minimum: 1}
        occurred_at: {type: string, format: date-time}
        category_id: {type: [string, 'null'], format: uuid}
        category_name: {type: [string, 'null']}
        note: {type: [string, 'null']}
        transfer_id: {type: [string, 'null'], format: uuid}
    PaymentLink:
      type: object
      required: [payment_id, transaction_id]
      properties:
        payment_id: {type: string, format: uuid}
        transaction_id: {type: [string, 'null'], format: uuid}
    Payment:
      type: object
      required: [id, occurrence_id, amount_vnd, paid_at, reversed_at, transaction_id]
      properties:
        id: {type: string, format: uuid}
        occurrence_id: {type: string, format: uuid}
        amount_vnd: {type: integer, format: int64}
        paid_at: {type: string, format: date-time}
        reversed_at: {type: [string, 'null'], format: date-time}
        transaction_id: {type: [string, 'null'], format: uuid}
    SalaryReceipt:
      type: object
      required: [id, amount_vnd, received_on, received_at]
      properties:
        id: {type: string, format: uuid}
        amount_vnd: {type: integer, format: int64, minimum: 1}
        received_on: {type: string, format: date}
        received_at: {type: string, format: date-time}
    BudgetSettings:
      type: object
      required: [global_buffer_vnd, global_budget_vnd]
      properties:
        global_buffer_vnd: {type: integer, format: int64, minimum: 0}
        global_budget_vnd: {type: [integer, 'null'], format: int64, minimum: 1}
    SalaryCycle:
      type: object
      required: [start, end, days_remaining, projected]
      properties:
        start: {type: string, format: date}
        end:
          type: string
          format: date
          description: Next payday; the cycle is half-open and ends before this date.
        days_remaining: {type: integer, minimum: 1}
        projected:
          type: boolean
          description: True when the next payday is the conservative day-10 projection instead of a recorded payday.
    ForecastItem:
      type: object
      required: [occurrence_id, obligation_name, due_date, remaining_vnd, certainty, overdue]
      properties:
        occurrence_id: {type: string, format: uuid}
        obligation_name: {type: string}
        due_date: {type: string, format: date}
        remaining_vnd: {type: integer, format: int64}
        certainty: {type: string, enum: [confirmed, expected]}
        overdue: {type: boolean}
    BudgetSnapshot:
      type: object
      required:
        - cycle
        - cash_on_hand_vnd
        - reserved_confirmed_vnd
        - reserved_expected_vnd
        - global_buffer_vnd
        - global_budget_vnd
        - spent_in_cycle_vnd
        - available_vnd
        - spendable_vnd
        - daily_allowance_vnd
        - warnings
        - forecast
      properties:
        cycle: {$ref: '#/components/schemas/SalaryCycle'}
        cash_on_hand_vnd: {type: integer, format: int64, description: Opening balances plus postings of non-credit accounts.}
        reserved_confirmed_vnd: {type: integer, format: int64}
        reserved_expected_vnd: {type: integer, format: int64}
        global_buffer_vnd: {type: integer, format: int64}
        global_budget_vnd: {type: [integer, 'null'], format: int64}
        spent_in_cycle_vnd: {type: integer, format: int64, description: Expense and fee postings inside the cycle.}
        available_vnd: {type: integer, format: int64, description: Cash minus reserves minus buffer; negative means a shortfall.}
        spendable_vnd: {type: integer, format: int64, minimum: 0}
        daily_allowance_vnd: {type: integer, format: int64, minimum: 0}
        warnings:
          type: array
          items:
            type: string
            enum: [SHORTFALL, OVERDUE, ESTIMATED_RESERVE, PROJECTED_PAYDAY, BUDGET_EXCEEDED]
        forecast:
          type: array
          items: {$ref: '#/components/schemas/ForecastItem'}
    CashflowForecast:
      type: object
      required: [cycle, confirmed_total_vnd, expected_total_vnd, items]
      properties:
        cycle: {$ref: '#/components/schemas/SalaryCycle'}
        confirmed_total_vnd: {type: integer, format: int64}
        expected_total_vnd: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: '#/components/schemas/ForecastItem'}
