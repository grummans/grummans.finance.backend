services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: terminal_finance
      POSTGRES_USER: terminal_finance
      POSTGRES_PASSWORD: terminal_finance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_finance -d terminal_finance"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
